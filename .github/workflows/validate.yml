name: Validate knowledge hub
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/validate-seminars.mjs
      - run: node scripts/validate-presentation.mjs
      - run: node scripts/validate-presentation-pages.mjs
      - run: node scripts/validate-presentation-editorial.mjs
      - run: npm run build
