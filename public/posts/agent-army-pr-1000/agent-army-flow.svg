<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'NanumGothic','Gothic A1','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="900" height="430" fill="#f8fafc" rx="16"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Agent 군단 Workflow: 1명의 사람 → N개의 Agent → PR</text>
  <!-- human -->
  <rect x="30" y="150" width="130" height="90" rx="12" fill="#1e293b"/>
  <text x="95" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">나 (사람)</text>
  <text x="95" y="208" text-anchor="middle" font-size="12" fill="#cbd5e1">총괄 셰프 · 책임자</text>
  <text x="95" y="226" text-anchor="middle" font-size="12" fill="#cbd5e1">의도·우선순위</text>
  <line x1="160" y1="195" x2="205" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- coordinator -->
  <rect x="210" y="140" width="150" height="110" rx="12" fill="#2563eb"/>
  <text x="285" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">코디네이터 Agent</text>
  <text x="285" y="203" text-anchor="middle" font-size="12" fill="#dbeafe">클라우드 · 쪼개기 · 위임</text>
  <text x="285" y="221" text-anchor="middle" font-size="12" fill="#dbeafe">직접 구현하지 않음</text>
  <!-- outer loop input -->
  <rect x="180" y="52" width="210" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="285" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">개인 Agent (커넥터)</text>
  <text x="285" y="95" text-anchor="middle" font-size="11" fill="#3730a3">Slack·Linear·X 리포트 감시 → 넘김</text>
  <line x1="285" y1="108" x2="285" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- agents -->
  <g font-size="13" fill="#0f172a">
    <rect x="410" y="80" width="140" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="480" y="105" text-anchor="middle">개발 Agent #1</text>
    <rect x="410" y="135" width="140" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="480" y="160" text-anchor="middle">개발 Agent #2</text>
    <rect x="410" y="190" width="140" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="480" y="215" text-anchor="middle">리서치 Agent</text>
    <text x="480" y="252" text-anchor="middle" font-size="18" fill="#64748b">⋮</text>
    <rect x="410" y="265" width="140" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="480" y="290" text-anchor="middle">Agent #N</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M360,195 C385,195 385,100 407,100" marker-end="url(#a)"/>
    <path d="M360,195 C385,195 385,155 407,155" marker-end="url(#a)"/>
    <path d="M360,195 L407,210" marker-end="url(#a)"/>
    <path d="M360,195 C385,195 385,285 407,285" marker-end="url(#a)"/>
  </g>
  <!-- PRs + verification -->
  <rect x="600" y="140" width="120" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <text x="660" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">작은 PR들</text>
  <text x="660" y="200" text-anchor="middle" font-size="12" fill="#92400e">+ 검증 Agent</text>
  <text x="660" y="218" text-anchor="middle" font-size="12" fill="#92400e">실행·관찰·측정</text>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M550,100 C575,100 575,185 597,185" marker-end="url(#a)"/>
    <path d="M550,155 L597,190" marker-end="url(#a)"/>
    <path d="M550,210 L597,200" marker-end="url(#a)"/>
    <path d="M550,285 C575,285 575,210 597,210" marker-end="url(#a)"/>
  </g>
  <line x1="720" y1="195" x2="755" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="760" y="140" width="115" height="110" rx="12" fill="#f1f5f9" stroke="#334155"/>
  <text x="817" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">머지</text>
  <text x="817" y="203" text-anchor="middle" font-size="12" fill="#334155">사람은 샘플링</text>
  <text x="817" y="221" text-anchor="middle" font-size="12" fill="#334155">리뷰 · 필요시 revert</text>
  <!-- feedback loop -->
  <path d="M817,250 C817,390 95,390 95,243" stroke="#d97706" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <rect x="285" y="340" width="330" height="40" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#9a3412">반복되는 실수 → Lint·타입·Skill·검증으로 환경을 고친다</text>
</svg>
