<text x="652" y="225" class="tiny">행동</text>

<rect x="56" y="244" width="760" height="500" rx="24" fill="#e9ede3" stroke="#536347" stroke-width="3" stroke-dasharray="10 7"/>
<rect x="82" y="227" width="190" height="35" rx="17" fill="#536347"/>
<text x="177" y="251" text-anchor="middle" font-size="18" font-weight="700" fill="#fffdf8" style="fill:#fffdf8">AI 에이전트</text>

<rect x="89" y="279" width="694" height="118" rx="16" fill="#fffdf8" stroke="#cdd3c3" stroke-width="2"/>
