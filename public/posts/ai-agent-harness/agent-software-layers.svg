<rect x="891" y="594" width="257" height="116" rx="16" fill="#fffdf8" stroke="#ddcfc2" stroke-width="2"/>
<text x="912" y="632" class="h">다른 AI 에이전트</text>
<text x="912" y="659" class="sub">별도의 응용 · 운영 · 추론</text>
<path class="line" d="M783 541 H845 V651 H885"/>
<rect x="850" y="550" width="54" height="26" rx="11" fill="#f7f3ea" stroke="#9d503d"/>
<text x="877" y="569" text-anchor="middle" font-size="14" font-weight="700">A2A</text>
<text x="600" y="775" text-anchor="middle" class="tiny">개념 참고: World Economic Forum, AI Agents in Action (2025), Figure 2</text>
