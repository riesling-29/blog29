<text x="891" y="42" class="sub" font-weight="700" fill="#9d503d">외부 연결 자원</text>
<line x1="64" y1="54" x2="813" y2="54" stroke="#d3d6cb" stroke-width="2"/>
<line x1="886" y1="54" x2="1148" y2="54" stroke="#e1d4c9" stroke-width="2"/>

<rect x="88" y="75" width="688" height="126" rx="18" fill="#fffdf8" stroke="#d9d2c4" stroke-width="2"/>
