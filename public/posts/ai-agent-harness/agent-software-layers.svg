<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">AI 에이전트의 소프트웨어 구성과 외부 연결</title>
<desc id="desc">사용자와 이벤트가 있는 환경에 연결된 AI 에이전트의 경계 안에 응용, 오케스트레이션, 추론 층이 있습니다. 추론 층의 모델은 오케스트레이션의 계획·메모리·도구·작업 흐름과 응용 층의 인터페이스에 연결됩니다. 오케스트레이션은 MCP를 통해 외부 애플리케이션에, A2A를 통해 다른 에이전트에 연결됩니다.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536347"/></marker>
  <style>
    text { font-family: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#292b25 }
    .sub { font-size:16px; fill:#63675d }
    .tiny { font-size:14px; fill:#63675d }
    .h { font-size:24px; font-weight:700 }
    .chip { font-size:16px; font-weight:600; fill:#36462e }
    .line { stroke:#536347; stroke-width:2.6; fill:none; marker-end:url(#arr) }
  </style>
</defs>
