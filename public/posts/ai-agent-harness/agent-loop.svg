<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
  <title id="title">LLM의 도구 호출과 실제 명령 실행의 차이</title>
  <desc id="desc">하네스가 도구 명세를 모델에 전달합니다. LLM은 도구 이름과 인자를 포함한 호출을 반환하고, 하네스가 형식과 권한을 확인해 실행기에 전달합니다. 실행기는 작업 환경에서 실제 명령을 수행하고 결과를 하네스를 통해 다시 모델에 전달합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L9 5L0 10Z" fill="#526044"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L9 5L0 10Z" fill="#9b4d3b"/>
    </marker>
  </defs>
  <rect width="1320" height="800" rx="20" fill="#f5f2ea"/>
  <text x="42" y="53" fill="#292b25" font-size="29" font-weight="700" font-family="'Noto Sans KR', Arial, sans-serif">도구 호출은 요청이고, 실행은 별도 단계입니다</text>
  <text x="42" y="85" fill="#65685e" font-size="17" font-family="'Noto Sans KR', Arial, sans-serif">코딩 에이전트 예시 · 명령은 실행기가 작업 환경에서 처리합니다</text>

  <g font-family="'Noto Sans KR', Arial, sans-serif">
    <rect x="34" y="132" width="390" height="225" rx="15" fill="#fffdf8" stroke="#526044" stroke-width="2"/>
    <text x="58" y="169" fill="#526044" font-size="15" font-weight="700">01 · 하네스가 입력을 준비</text>
    <text x="58" y="208" fill="#292b25" font-size="22" font-weight="700">요청 + 맥락 + 도구 명세</text>
    <line x1="58" y1="226" x2="400" y2="226" stroke="#d6d3c7"/>
    <text x="58" y="259" fill="#42443c" font-size="17">도구 이름 · 설명 · 인자 형식</text>
    <text x="58" y="288" fill="#42443c" font-size="17">예: run_command(command: string)</text>
    <text x="58" y="329" fill="#77786d" font-size="14">모델은 제공된 도구 목록을 보고 선택합니다</text>

    <rect x="465" y="132" width="390" height="225" rx="15" fill="#fffaf5" stroke="#9b4d3b" stroke-width="2"/>
    <text x="489" y="169" fill="#9b4d3b" font-size="15" font-weight="700">02 · LLM이 도구 호출을 반환</text>
    <text x="489" y="208" fill="#292b25" font-size="22" font-weight="700">tool_call: 이름 + 인자</text>
    <line x1="489" y1="226" x2="831" y2="226" stroke="#dfc9bf"/>
    <text x="489" y="260" fill="#42443c" font-size="17">name: run_command</text>
    <text x="489" y="289" fill="#42443c" font-size="17">arguments: {"command":"npm test"}</text>
    <text x="489" y="329" fill="#8a4333" font-size="14" font-weight="700">실행된 명령이 아니라 구조화된 요청입니다</text>

    <rect x="896" y="132" width="390" height="225" rx="15" fill="#fffdf8" stroke="#526044" stroke-width="2"/>
    <text x="920" y="169" fill="#526044" font-size="15" font-weight="700">03 · 하네스가 확인하고 라우팅</text>
    <text x="920" y="208" fill="#292b25" font-size="22" font-weight="700">형식 · 권한 · 작업 범위</text>
    <line x1="920" y1="226" x2="1262" y2="226" stroke="#d6d3c7"/>
    <text x="920" y="259" fill="#42443c" font-size="17">등록된 도구인지 검사합니다</text>
    <text x="920" y="288" fill="#42443c" font-size="17">승인 또는 샌드박스 정책을 적용합니다</text>
    <text x="920" y="329" fill="#77786d" font-size="14">허용되면 해당 도구 구현에 전달합니다</text>

    <rect x="896" y="467" width="390" height="205" rx="15" fill="#f7fafb" stroke="#52647a" stroke-width="2"/>
    <text x="920" y="504" fill="#52647a" font-size="15" font-weight="700">04 · 실행기와 작업 환경</text>
    <text x="920" y="543" fill="#292b25" font-size="22" font-weight="700">명령이나 도구를 실제 처리</text>
    <line x1="920" y1="561" x2="1262" y2="561" stroke="#d1d8dd"/>
    <text x="920" y="594" fill="#42443c" font-size="17">셸 도구: npm test 프로세스 실행</text>
    <text x="920" y="623" fill="#42443c" font-size="17">파일·검색 도구: 각 handler가 처리</text>
    <text x="920" y="650" fill="#77786d" font-size="14">실행 위치와 접근 권한은 구성에 따릅니다</text>

    <rect x="465" y="467" width="390" height="205" rx="15" fill="#fffdf8" stroke="#a28d5c" stroke-width="2"/>
    <text x="489" y="504" fill="#806b3c" font-size="15" font-weight="700">05 · 실행 결과</text>
    <text x="489" y="543" fill="#292b25" font-size="22" font-weight="700">출력과 상태를 수집</text>
    <line x1="489" y1="561" x2="831" y2="561" stroke="#ddd5c1"/>
    <text x="489" y="594" fill="#42443c" font-size="17">stdout · stderr · 종료 코드</text>
    <text x="489" y="623" fill="#42443c" font-size="17">성공 · 오류 · 거절 결과</text>
    <text x="489" y="650" fill="#77786d" font-size="14">도구에 따라 구조화된 결과가 반환됩니다</text>

    <rect x="34" y="467" width="390" height="205" rx="15" fill="#fffdf8" stroke="#526044" stroke-width="2"/>
    <text x="58" y="504" fill="#526044" font-size="15" font-weight="700">06 · 결과를 모델에 반환</text>
    <text x="58" y="543" fill="#292b25" font-size="22" font-weight="700">tool_result + call_id</text>
    <line x1="58" y1="561" x2="400" y2="561" stroke="#d6d3c7"/>
    <text x="58" y="594" fill="#42443c" font-size="17">결과를 맥락에 붙여 다시 호출</text>
    <text x="58" y="623" fill="#42443c" font-size="17">다음 도구 요청 또는 최종 답변</text>
    <text x="58" y="650" fill="#77786d" font-size="14">완료 · 오류 · 중단 조건에서 멈춥니다</text>
  </g>

  <g fill="none" stroke="#526044" stroke-width="3" marker-end="url(#arrow)">
    <path d="M424 245H455"/>
    <path d="M855 245H886"/>
    <path d="M1091 364V454"/>
    <path d="M896 570H864"/>
    <path d="M465 570H433"/>
  </g>
  <text x="1110" y="415" fill="#65685e" font-size="13" font-family="'Noto Sans KR', Arial, sans-serif">허용된 호출</text>

  <path d="M229 464C229 409 660 430 660 365" fill="none" stroke="#9b4d3b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#returnArrow)"/>
  <rect x="367" y="400" width="275" height="27" rx="13" fill="#f5f2ea"/>
  <text x="504" y="419" fill="#8a4333" font-size="14" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif">도구 결과를 넣어 모델을 다시 호출합니다</text>

  <text x="42" y="746" fill="#65685e" font-size="15" font-family="'Noto Sans KR', Arial, sans-serif">실제 API 형식은 서로 다릅니다. 예: OpenAI function_call / function_call_output · Anthropic tool_use / tool_result</text>
  <text x="42" y="773" fill="#65685e" font-size="14" font-family="'Noto Sans KR', Arial, sans-serif">도구 요청만으로 실행이 보장되지는 않습니다. 하네스의 라우팅과 실행 정책이 다음 단계를 결정합니다.</text>
</svg>
