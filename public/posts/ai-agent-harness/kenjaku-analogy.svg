<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">켄자쿠 비유로 보는 LLM, 하네스, 에이전트</title>
  <desc id="desc">왼쪽에는 켄자쿠 이미지와 뇌만 있는 상태를 LLM으로 나타냅니다. 가운데에는 다른 사람의 몸과 그 기능을 하네스로 표현합니다. 오른쪽은 뇌와 몸이 목표에 따라 함께 작동하는 전체를 에이전트 시스템으로 나타냅니다. 두 화살표가 세 단계를 연결합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 10 6 1 11" fill="none" stroke="#526044" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="20" fill="#f5f2ea"/>
  <text x="40" y="58" fill="#292b25" font-size="28" font-weight="600" font-family="Georgia, 'Noto Serif KR', serif">켄자쿠 비유로 보는 LLM · 하네스 · 에이전트</text>
  <text x="40" y="91" fill="#65685e" font-size="16" font-family="'Noto Sans KR', Arial, sans-serif">뇌의 판단, 몸이 가진 기능, 목표를 향해 작동하는 전체 시스템</text>

  <rect x="28" y="120" width="350" height="445" rx="14" fill="#faf8f2" stroke="#d6d3c7" stroke-width="2"/>
  <rect x="425" y="120" width="350" height="445" rx="14" fill="#faf8f2" stroke="#d6d3c7" stroke-width="2"/>
  <rect x="822" y="120" width="350" height="445" rx="14" fill="#faf8f2" stroke="#d6d3c7" stroke-width="2"/>

  <text x="52" y="158" fill="#526044" font-size="17" font-weight="700" font-family="'Noto Sans KR', Arial, sans-serif">01 · 뇌만 있는 켄자쿠</text>
  <rect x="80" y="174" width="246" height="282" rx="8" fill="#ffffff" stroke="#d6d3c7"/>
  <image href="/posts/ai-agent-harness/kenjaku-user-provided.png" x="80" y="174" width="246" height="282" preserveAspectRatio="xMidYMid meet"/>
  <text x="52" y="494" fill="#292b25" font-size="25" font-weight="700" font-family="Georgia, 'Noto Serif KR', serif">LLM</text>
  <text x="52" y="526" fill="#65685e" font-size="16" font-family="'Noto Sans KR', Arial, sans-serif">맥락을 바탕으로 다음 행동을 판단합니다</text>

  <path d="M386 335H412" fill="none" stroke="#526044" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="435" y="158" fill="#526044" font-size="17" font-weight="700" font-family="'Noto Sans KR', Arial, sans-serif">02 · 다른 사람의 몸</text>
  <g fill="none" stroke="#526044" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="600" cy="235" r="48"/>
    <path d="M535 410c0-72 30-112 65-112s65 40 65 112M555 340l-36 65M645 340l36 65M572 406l-8 32M628 406l8 32"/>
  </g>
  <rect x="470" y="420" width="120" height="42" rx="7" fill="#eeeadf" stroke="#d6d3c7"/>
  <rect x="610" y="420" width="120" height="42" rx="7" fill="#eeeadf" stroke="#d6d3c7"/>
  <text x="510" y="447" fill="#35432b" font-size="16" font-family="'Noto Sans KR', Arial, sans-serif">파일</text>
  <text x="650" y="447" fill="#35432b" font-size="16" font-family="'Noto Sans KR', Arial, sans-serif">터미널</text>
  <text x="452" y="494" fill="#292b25" font-size="23" font-weight="700" font-family="Georgia, 'Noto Serif KR', serif">하네스 + 실행 환경</text>
  <text x="452" y="526" fill="#65685e" font-size="16" font-family="'Noto Sans KR', Arial, sans-serif">도구와 권한, 작업 상태를 연결합니다</text>

  <path d="M783 335H809" fill="none" stroke="#526044" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="846" y="158" fill="#526044" font-size="17" font-weight="700" font-family="'Noto Sans KR', Arial, sans-serif">03 · 뇌와 몸이 함께 작동</text>
  <g fill="none" stroke="#526044" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="997" cy="235" r="48"/>
    <path d="M932 410c0-72 30-112 65-112s65 40 65 112M952 340l-36 65M1042 340l36 65M969 406l-8 32M1025 406l8 32"/>
  </g>
  <path d="M971 234c-12-14-1-29 12-24 8-15 27-9 27 3 14-4 24 10 15 20 8 13-6 27-18 19-12 12-29 1-24-10-13 0-16-11-12-8Z" fill="#eeeadf" stroke="#526044" stroke-width="2"/>
  <path d="M994 214v38m-11-28 10 5m10-14-9 11" fill="none" stroke="#526044" stroke-width="2"/>
  <circle cx="997" cy="410" r="8" fill="#526044"/>
  <text x="850" y="494" fill="#292b25" font-size="25" font-weight="700" font-family="Georgia, 'Noto Serif KR', serif">에이전트 시스템</text>
  <text x="850" y="526" fill="#65685e" font-size="16" font-family="'Noto Sans KR', Arial, sans-serif">목표를 향해 도구를 쓰고 결과를 반영합니다</text>

  <text x="40" y="594" fill="#65685e" font-size="14" font-family="'Noto Sans KR', Arial, sans-serif">비유는 개념 설명을 위한 것이며, 실제 하네스와 실행 환경은 분리될 수 있습니다.</text>
</svg>