<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">켄자쿠 비유: 뇌, 몸, 에이전트</title>
  <desc id="desc">뇌 상태는 LLM의 판단, 도구가 있는 몸은 하네스와 실행 환경, 목표에 따라 둘이 움직이는 전체는 에이전트 시스템이라는 비유를 보여 준다.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c31"/><stop offset="1" stop-color="#09111f"/></linearGradient>
    <linearGradient id="halo" x2="1" y2="1"><stop stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity=".03"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6 1 11" fill="none" stroke="#94a3b8" stroke-width="2"/></marker>
    <g id="brain" fill="#a78bfa" fill-opacity=".22" stroke="#c4b5fd" stroke-width="4" stroke-linejoin="round">
      <path d="M-53 6C-77-21-46-48-22-41C-4-62 23-54 29-40C58-49 75-27 64-5C77 16 63 41 40 41C28 57 4 55-4 46C-30 61-50 46-52 29C-67 27-70 14-53 6Z"/>
      <path d="M-16-35C-31-25-34-9-18-2M13-42C5-22 23-16 12 4M46-29C25-20 40-4 30 8M-39 17C-12 7-17 32-29 38M-1 12C14 7 21 24 7 41" fill="none" stroke-width="3"/>
    </g>
    <g id="person" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-73 177C-72 124-43 112-31 108M73 177C72 124 43 112 31 108M-73 177L-82 232M73 177L82 232M-28 111L-36 207M28 111L36 207M-36 207L-58 250M36 207L58 250"/>
      <circle cx="0" cy="69" r="51"/>
      <path d="M-23 112Q0 124 23 112"/>
    </g>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="48" y="57" fill="#f8fafc" font-size="27" font-weight="700" font-family="Arial, sans-serif">Kenjaku analogy: from model to agent</text>
  <text x="48" y="91" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">Concept diagram; no character artwork reproduced</text>
  <rect x="30" y="117" width="350" height="440" rx="22" fill="#111a2a" stroke="#453b69" stroke-width="2"/>
  <rect x="425" y="117" width="350" height="440" rx="22" fill="#101e2b" stroke="#256a65" stroke-width="2"/>
  <rect x="820" y="117" width="350" height="440" rx="22" fill="#111e2b" stroke="#a88d56" stroke-width="2"/>
  <circle cx="205" cy="289" r="101" fill="url(#halo)"/>
  <use xlink:href="#brain" transform="translate(205 289) scale(1.22)"/>
  <text x="57" y="159" fill="#c4b5fd" font-size="19" font-weight="700" font-family="Arial, sans-serif">01  BRAIN ALONE</text>
  <text x="57" y="444" fill="#f8fafc" font-size="24" font-weight="700" font-family="Arial, sans-serif">LLM</text>
  <text x="57" y="476" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">Chooses the next step</text>
  <text x="57" y="508" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">No file or shell access by itself</text>
  <path d="M388 329H414" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="452" y="159" fill="#6ee7b7" font-size="19" font-weight="700" font-family="Arial, sans-serif">02  BODY + TECHNIQUES</text>
  <use xlink:href="#person" transform="translate(600 192) scale(.86)" stroke="#6ee7b7"/>
  <rect x="454" y="336" width="78" height="45" rx="10" fill="#183e3d" stroke="#65dac3"/>
  <text x="467" y="365" fill="#d1fae5" font-size="16" font-family="Arial, sans-serif">Files</text>
  <rect x="668" y="336" width="79" height="45" rx="10" fill="#183e3d" stroke="#65dac3"/>
  <text x="677" y="365" fill="#d1fae5" font-size="16" font-family="Arial, sans-serif">Shell</text>
  <text x="452" y="444" fill="#f8fafc" font-size="24" font-weight="700" font-family="Arial, sans-serif">Harness + workspace</text>
  <text x="452" y="476" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">Connects tools, rules, and state</text>
  <text x="452" y="508" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">Capabilities depend on the host</text>
  <path d="M783 329H808" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="847" y="159" fill="#fbbf74" font-size="19" font-weight="700" font-family="Arial, sans-serif">03  COMBINED IN ACTION</text>
  <use xlink:href="#person" transform="translate(995 192) scale(.86)" stroke="#fbbf74"/>
  <use xlink:href="#brain" transform="translate(995 251) scale(.47)"/>
  <path d="M874 360H912M1077 360H1115" stroke="#fbbf74" stroke-width="3" stroke-linecap="round"/>
  <circle cx="995" cy="367" r="9" fill="#fbbf74"/>
  <text x="847" y="444" fill="#f8fafc" font-size="24" font-weight="700" font-family="Arial, sans-serif">Agent system</text>
  <text x="847" y="476" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">Uses tools toward a goal</text>
  <text x="847" y="508" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">Observes results and decides again</text>
  <text x="48" y="596" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">Limit of the analogy: harness and execution environment may be separate.</text>
</svg>
