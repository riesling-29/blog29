<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
<title id="t">예시 로그의 DFG</title>
<desc id="d">다섯 활동과 직접 이어진 횟수. 실행에서 보고로 가는 간선 1회를 점선으로 강조.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5160"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
</defs>
<style>
text{font-family:Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#1F2329}
.lbl{font-size:20px;font-weight:600}
.sm{font-size:15px;fill:#5B6170}
.h{font-size:18px;font-weight:700}
.num{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}
.code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:15px;fill:#5B6170}
.acc{fill:#C2410C;font-weight:700}
.node{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}
.e{fill:none;stroke:#4B5160;marker-end:url(#ah)}

</style>
<rect x="0.5" y="0.5" width="719" height="359" rx="16" fill="#FFFFFF" stroke="#D9DCE1"/>
<text class="sm" x="28" y="42">간선 위 숫자: 같은 케이스에서 바로 뒤에 온 횟수 (합계 <tspan class="num" style="font-size:15px">16</tspan>)</text>
<rect class="node" x="28" y="140" width="100" height="56" rx="10"/><text class="lbl" x="78.0" y="175.0" text-anchor="middle">접수</text>
<rect class="node" x="174" y="140" width="100" height="56" rx="10"/><text class="lbl" x="224.0" y="175.0" text-anchor="middle">계획</text>
<rect class="node" x="320" y="140" width="100" height="56" rx="10"/><text class="lbl" x="370.0" y="175.0" text-anchor="middle">실행</text>
<rect class="node" x="466" y="140" width="100" height="56" rx="10"/><text class="lbl" x="516.0" y="175.0" text-anchor="middle">검증</text>
<rect class="node" x="612" y="140" width="84" height="56" rx="10"/><text class="lbl" x="654.0" y="175.0" text-anchor="middle">보고</text>
<line class="e" x1="128" y1="168" x2="173" y2="168" stroke-width="5"/><text class="num" x="151.0" y="148" text-anchor="middle">4</text>
<line class="e" x1="274" y1="168" x2="319" y2="168" stroke-width="5"/><text class="num" x="297.0" y="148" text-anchor="middle">4</text>
<line class="e" x1="420" y1="168" x2="465" y2="168" stroke-width="3.5"/><text class="num" x="443.0" y="148" text-anchor="middle">3</text>
<line class="e" x1="566" y1="168" x2="611" y2="168" stroke-width="3.5"/><text class="num" x="589.0" y="148" text-anchor="middle">3</text>
<path class="e" d="M352,140 C338,84 408,84 392,138" stroke-width="2"/><text class="num" x="372" y="90" text-anchor="middle">1</text>
<path d="M370,196 C370,276 654,276 654,199" fill="none" stroke="#C2410C" stroke-width="3.5" stroke-dasharray="9 6" marker-end="url(#ahA)"/>
<text class="num acc" x="512" y="282" text-anchor="middle">1</text>
<text class="acc" style="font-size:17px" x="512" y="308" text-anchor="middle">실행 → 보고 (T4, 검증 없이 보고)</text>
<text class="sm" x="28" y="340">주황 점선: 강조한 간선 · 횟수가 많을수록 굵게</text>
</svg>
