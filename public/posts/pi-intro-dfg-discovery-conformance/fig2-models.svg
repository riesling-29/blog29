<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d">
<title id="t">발견된 모델과 기준 모델</title>
<desc id="d">두 프로세스 트리는 검증 앞의 배타적 선택 하나만 다르다.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5160"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
</defs>
<style>
text{font-family:Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#1F2329}
.lbl{font-size:20px;font-weight:600}
.sm{font-size:15px;fill:#5B6170}
.h{font-size:18px;font-weight:700}
.num{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}
.code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:15px;fill:#5B6170}
.acc{fill:#C2410C;font-weight:700}
.node{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}
.e{fill:none;stroke:#4B5160;marker-end:url(#ah)}
.grp{fill:none;stroke:#9AA0AB;stroke-width:1.2} .tau{fill:#FFFFFF;stroke:#9AA0AB;stroke-width:1.2;stroke-dasharray:3 3} .op{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:20px;font-weight:700;fill:#4B5160} .arr{font-size:18px;fill:#6B7280} .tt{font-size:19px;fill:#6B7280;font-style:italic}
</style>
<rect x="0.5" y="0.5" width="719" height="429" rx="16" fill="#FFFFFF" stroke="#D9DCE1"/>
<rect x="448" y="96" width="156" height="276" rx="10" fill="#FFF4ED" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="8 5"/>
<text class="h" x="28" y="42">발견된 모델</text><text class="code" x="28" y="70">→( 접수, 계획, ↻( 실행, τ ), ×( 검증, τ ), 보고 )</text>
<rect class="node" x="24" y="92" width="74" height="48" rx="10"/><text class="lbl" x="61.0" y="123.0" text-anchor="middle">접수</text>
<text class="arr" x="102" y="123">→</text><rect class="node" x="122" y="92" width="74" height="48" rx="10"/><text class="lbl" x="159.0" y="123.0" text-anchor="middle">계획</text>
<text class="arr" x="200" y="123">→</text><rect class="grp" x="222" y="86" width="196" height="60" rx="10"/><text class="op" x="232" y="124">↻</text><rect class="node" x="256" y="92" width="78" height="48" rx="10"/><text class="lbl" x="295.0" y="123.0" text-anchor="middle">실행</text>
<rect class="tau" x="344" y="98" width="62" height="36" rx="7"/><text class="tt" x="375" y="123" text-anchor="middle">τ</text><text class="arr" x="424" y="123">→</text><rect class="grp" x="456" y="86" width="140" height="60" rx="10" style="stroke:#C2410C"/><text class="op" x="464" y="124" style="fill:#C2410C">×</text><rect class="node" x="486" y="92" width="64" height="48" rx="10"/><text class="lbl" x="518.0" y="123.0" text-anchor="middle">검증</text>
<rect class="tau" x="556" y="98" width="34" height="36" rx="7"/><text class="tt" x="573" y="123" text-anchor="middle">τ</text><text class="arr" x="610" y="123">→</text><rect class="node" x="630" y="92" width="66" height="48" rx="10"/><text class="lbl" x="663.0" y="123.0" text-anchor="middle">보고</text>
<line x1="28" y1="206" x2="692" y2="206" stroke="#E5E7EB"/>
<text class="h" x="28" y="240">기준 모델</text><text class="code" x="28" y="268">→( 접수, 계획, ↻( 실행, τ ), 검증, 보고 )</text>
<rect class="node" x="24" y="290" width="74" height="48" rx="10"/><text class="lbl" x="61.0" y="321.0" text-anchor="middle">접수</text>
<text class="arr" x="102" y="321">→</text><rect class="node" x="122" y="290" width="74" height="48" rx="10"/><text class="lbl" x="159.0" y="321.0" text-anchor="middle">계획</text>
<text class="arr" x="200" y="321">→</text><rect class="grp" x="222" y="284" width="196" height="60" rx="10"/><text class="op" x="232" y="322">↻</text><rect class="node" x="256" y="290" width="78" height="48" rx="10"/><text class="lbl" x="295.0" y="321.0" text-anchor="middle">실행</text>
<rect class="tau" x="344" y="296" width="62" height="36" rx="7"/><text class="tt" x="375" y="321" text-anchor="middle">τ</text><text class="arr" x="424" y="321">→</text><rect class="node" x="486" y="290" width="64" height="48" rx="10"/><text class="lbl" x="518.0" y="321.0" text-anchor="middle">검증</text>
<text class="arr" x="610" y="321">→</text><rect class="node" x="630" y="290" width="66" height="48" rx="10"/><text class="lbl" x="663.0" y="321.0" text-anchor="middle">보고</text>
<text class="sm" x="28" y="404">점선 상자 τ: 로그에 남지 않는 단계</text><text class="acc" style="font-size:16px" x="692" y="404" text-anchor="end">점선 테두리: 차이, 검증 앞의 선택 ×</text>
</svg>
